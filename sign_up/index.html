<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Vortex</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .auth-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .btn-back {
      position: absolute;
      top: 1rem;
      left: 1rem;
      text-decoration: none;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
    }

    .btn-back:hover {
      color: #0f172a;
    }

    .auth-card h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 0.5rem;
      text-align: center;
      margin-top: 1rem;
    }

    .auth-card p {
      color: #64748b;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
    }

    .auth-footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <a href="../" class="btn-back">← Accueil</a>
    <h1>Créer un compte</h1>
    <p>Rejoignez Vortex dès aujourd'hui</p>

    <form action="../sign_in/" method="GET">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">S'inscrire</button>
    </form>

    <div class="auth-footer">
      Vous avez déjà un compte ? <a href="../sign_in/">Se connecter</a>
    </div>
  </div>

</body>
</html>
