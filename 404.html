    * {

    body {
      background-color: #f8fafc;
      color: #334155;

    header {

      color: #0f172a;
      text-align: left;
    }

    /* Conteneur des boutons du header */

      display: flex;
      gap: 0.75rem; /* Espacement propre entre les deux boutons */

    }

    .btn-login {
      text-decoration: none;
      color: #2563eb;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border: 1px solid #2563eb;
      border-radius: 6px;
    }

      text-decoration: none;

      background-color: #2563eb;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border: 1px solid #2563eb;
      border-radius: 6px;
    }

    /* Section Principale (Hero / 404) */
    .hero {
      flex: 1; /* Permet au contenu principal d'occuper tout l'espace disponible et de pousser le footer */
      text-align: center;
      padding: 3rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .hero h1 {
      font-size: 2.5rem;
      color: #0f172a;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.1rem;
      color: #64748b;
      margin-bottom: 2rem;
    }

    /* Footer compact collé en bas */
    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      font-size: 0.85rem;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
      background-color: #ffffff;
    }
